[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "firepanel-commissioning"
version = "0.1.0"
description = "Desktop commissioning workspace for Advanced MxPro NCF and SKF configurations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
dependencies = [
  "PySide6>=6.7,<7",
  "QtAwesome>=1.3,<2",
  "ezdxf>=1.3,<2",
  "Shapely>=2.0,<3",
  "reportlab>=4.2,<5",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
test = ["pytest>=8.2,<9"]

[project.scripts]
firepanel = "main:main"

[tool.setuptools]
packages = ["firepanel"]

[tool.setuptools.package-data]
firepanel = ["assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
